name: Feature request
description: Propose an improvement to the template or a new QR capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Additional context
      description: Add examples, sketches, compatibility concerns, or links.
